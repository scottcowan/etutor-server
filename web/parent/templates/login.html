<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f8f8;
      color: #2c2c2c;
    }
    .login-wrapper {
      max-width: 360px;
      margin: 80px auto;
      padding: 32px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
    }
    .login-wrapper h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input[type="password"] {
      display: block;
      width: 100%;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="password"]:focus {
      border-color: #7a9e7e;
    }
    button[type="submit"] {
      display: block;
      width: 100%;
      background: #7a9e7e;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button[type="submit"]:hover {
      background: #6b8e6f;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <h1>Parent Dashboard</h1>
    <form method="POST" action="/parent/login">
      <label for="password">Passphrase</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        autofocus
      >
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
